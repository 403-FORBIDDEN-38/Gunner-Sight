[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gunnersight"
version = "0.0140300182"  # 与 gui/tabs/info_tab.py 的 APP_VERSION 保持同步（该常量为唯一权威来源）
description = "Squad vehicle reticle overlay tool"
requires-python = ">=3.10,<3.14"  # 上界：PyQt5 5.15.x 的 wheel 覆盖到 3.13
dependencies = [
    "PyQt5>=5.15.11,<5.16",  # 和用户原环境 5.15.11 对齐
    # PyQt5 5.15.11 的 Windows wheel 自包含 Qt，但对 PyQt5-Qt5 是无 marker 强依赖；
    # [5.15.2,5.16.0) 内唯一有 win_amd64 wheel 的是 5.15.2（PyPI 实证：5.15.3~5.15.10
    # 无任何文件，5.15.11+ 仅 macOS wheel）。放行到 <5.15.14 会让 uv sync 在所有
    # Windows 机器上解析失败（旧 lock 锁的 5.15.13 即此事故）。与用户本机 5.15.2 对齐。
    "pyqt5-qt5>=5.15.2,<5.15.3",
    "Pillow>=9.0,<11.0",
    "keyboard>=0.13,<1.0",
    "loguru>=0.7,<1.0",
    # >=10.0 是实质要求：core/magnifier.py 的 CAPTUREBLT 放大镜 import mss.windows.gdi（10.x 独有模块结构）
    "mss>=10.0,<11",  # 上界：9→10 的 breaking change 已咬过一次（S1 由来）
]

# 打包链依赖单独成组：默认安装不拉 Nuitka/C 编译器工具链
[project.optional-dependencies]
build = ["nuitka", "zstandard"]

# 扁平布局多顶级包（core/gui/tests/tools/config/resources/frames...），
# 必须显式声明包发现，否则 pip install . 报 "Multiple top-level packages discovered"
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "gui*"]

# 依赖源声明（P1-1）：uv.lock 里 1437 处 source 均为阿里云镜像，此处显式声明
# （default=true）让「代码里写的」与「实际用的」一致——克隆仓库的人不设
# UV_DEFAULT_INDEX 也能复现同一份 lock（此前 uv lock --check 判定 lock 过期）。
# 海外环境可用 `uv sync --index` 或环境变量覆盖。
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long - handled by formatter
    "B008",  # function call in default argument - Qt patterns
    "E702",  # multiple statements on one line (semicolon) - project style: lazy imports
    "E701",  # multiple statements on one line (colon) - project style
    "E402",  # module import not at top - project style: conditional/lazy imports
    "SIM105",  # suppressible exception - cleanup paths intentionally swallow exceptions
    "SIM102",  # collapsible-if - style preference
    "SIM108",  # ternary-style - style preference
    "UP031",   # printf-style formatting - project style
    "B007",    # unused loop control - `for _ in range()` pattern
    "SIM115",  # open without context - startup_log needs persistent handle
    "I001",    # import sorting - lazy imports inside functions are project style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E", "F"]
"core/win32_utils.py" = ["F403", "F405"]  # ctypes wildcard imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# 固定收集范围：backups/ 里有仓库历史副本（含同名 tests/ 与 tools/ui_access_test.py），
# 裸 pytest 会连备份一起收集，报 ImportPathMismatchError 中断全量验证
[tool.pytest.ini_options]
testpaths = ["tests"]
